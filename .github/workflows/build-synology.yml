name: Build Synology evaluation package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Check source tests and prepare context
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          python tools/prepare_build.py --build 23 --output release-build/context
      - name: Build Linux image and collect its corresponding sources
        run: |
          set -euo pipefail
          version=0.1.0-0023
          image=pjsoft/mediagrabber-nas:spk-$version
          mkdir -p release-build
          docker build --pull --platform linux/amd64 --build-arg MG_VERSION=$version -t "$image" release-build/context
          docker save "$image" | gzip -n > release-build/image.tar.gz
          python tools/collect_runtime_sources.py --image "$image" --archive release-build/image.tar.gz --version "$version" --output release-build/MediaGrabber-NAS-$version-runtime-sources.tar.gz
          python tools/build_spk.py --build 23 --offline-image release-build/image.tar.gz --runtime-sources release-build/MediaGrabber-NAS-$version-runtime-sources.tar.gz --output release-build
          cp release-build/context/SOURCE.tar.gz release-build/MediaGrabber-NAS-0.1.0-beta.23-source.tar.gz
          rm release-build/image.tar.gz
      - name: Save review artifacts without publishing a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: MediaGrabber-NAS-0023-review
          path: |
            release-build/*.spk
            release-build/*.sha256
            release-build/*sources.tar.gz
            release-build/*source.tar.gz
          retention-days: 1
          compression-level: 0
