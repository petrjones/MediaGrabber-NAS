# Registered with DSM's native web-config worker; no global templates edited.
location = /mediagrabber {
    return 302 /mediagrabber/;
}
location ^~ /mediagrabber/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $http_host;
    proxy_set_header X-MG-Portal "1";
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never forward DSM credentials or its session cookies into the container.
    proxy_set_header Cookie "mg_portal_session=$cookie_mg_portal_session";
    proxy_set_header Authorization "";
    proxy_set_header X-Syno-Token "";
    # Issuing grants is exclusively a host-to-container operation.
    proxy_set_header X-MG-Bridge-Key "";
    proxy_read_timeout 1200s;
    client_max_body_size 32m;
}
